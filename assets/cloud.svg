<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-labelledby="t d">
  <title id="t">Cloud hosting illustration</title>
  <desc id="d">A glowing cloud above a stack of servers connected by lines to browser windows.</desc>
  <defs>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12263f"/>
      <stop offset="1" stop-color="#0b1728"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="520" height="400" rx="24" fill="#08111f"/>
  <circle cx="260" cy="130" r="170" fill="url(#glow)"/>

  <!-- grid dots -->
  <g fill="#1e3a5f" opacity=".7">
    <circle cx="40" cy="40" r="2"/><circle cx="80" cy="40" r="2"/><circle cx="120" cy="40" r="2"/>
    <circle cx="40" cy="80" r="2"/><circle cx="80" cy="80" r="2"/>
    <circle cx="480" cy="360" r="2"/><circle cx="440" cy="360" r="2"/><circle cx="400" cy="360" r="2"/>
    <circle cx="480" cy="320" r="2"/><circle cx="440" cy="320" r="2"/>
  </g>

  <!-- connection lines -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="5 6" opacity=".8">
    <path d="M260 185 V240"/>
    <path d="M215 175 C150 200 120 230 100 275"/>
    <path d="M305 175 C370 200 400 230 420 275"/>
  </g>

  <!-- cloud -->
  <path d="M155 185c-32 0-58-24-58-54 0-28 22-51 51-54 10-28 36-47 68-47 36 0 65 25 72 58 3-1 7-1 10-1 29 0 53 22 53 49 0 28-24 49-53 49z"
        transform="translate(0 0)" fill="url(#cloud)"/>
  <path d="M150 168c-20 0-36-14-36-32" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
  <!-- lock on cloud -->
  <g transform="translate(236 118)">
    <rect x="0" y="16" width="48" height="36" rx="8" fill="#06121f"/>
    <path d="M10 16v-8a14 14 0 0 1 28 0v8" fill="none" stroke="#06121f" stroke-width="6" stroke-linecap="round"/>
    <circle cx="24" cy="32" r="5" fill="#22d3ee"/>
    <rect x="22" y="35" width="4" height="9" rx="2" fill="#22d3ee"/>
  </g>

  <!-- server stack -->
  <g transform="translate(205 240)">
    <rect width="110" height="34" rx="8" fill="url(#panel)" stroke="#2b4a73"/>
    <rect y="42" width="110" height="34" rx="8" fill="url(#panel)" stroke="#2b4a73"/>
    <rect y="84" width="110" height="34" rx="8" fill="url(#panel)" stroke="#2b4a73"/>
    <g fill="#22d3ee"><circle cx="18" cy="17" r="4"/><circle cx="18" cy="59" r="4"/><circle cx="18" cy="101" r="4"/></g>
    <g fill="#2b4a73"><rect x="36" y="14" width="56" height="6" rx="3"/><rect x="36" y="56" width="56" height="6" rx="3"/><rect x="36" y="98" width="56" height="6" rx="3"/></g>
  </g>

  <!-- browser windows -->
  <g transform="translate(40 270)">
    <rect width="110" height="78" rx="10" fill="url(#panel)" stroke="#2b4a73"/>
    <path d="M0 22h110" stroke="#2b4a73"/>
    <circle cx="14" cy="11" r="3" fill="#38bdf8"/><circle cx="25" cy="11" r="3" fill="#2b4a73"/><circle cx="36" cy="11" r="3" fill="#2b4a73"/>
    <rect x="14" y="34" width="50" height="7" rx="3.5" fill="#38bdf8" opacity=".8"/>
    <rect x="14" y="48" width="82" height="6" rx="3" fill="#2b4a73"/>
    <rect x="14" y="60" width="62" height="6" rx="3" fill="#2b4a73"/>
  </g>
  <g transform="translate(370 270)">
    <rect width="110" height="78" rx="10" fill="url(#panel)" stroke="#2b4a73"/>
    <path d="M0 22h110" stroke="#2b4a73"/>
    <circle cx="14" cy="11" r="3" fill="#22d3ee"/><circle cx="25" cy="11" r="3" fill="#2b4a73"/><circle cx="36" cy="11" r="3" fill="#2b4a73"/>
    <rect x="14" y="34" width="82" height="26" rx="6" fill="#2563eb" opacity=".55"/>
    <rect x="14" y="66" width="52" height="5" rx="2.5" fill="#2b4a73"/>
  </g>

  <text x="260" y="388" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#5b7ea8">HTTPS · STATIC · GLOBAL</text>
</svg>
